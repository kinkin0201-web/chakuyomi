# 当日の予測を更新する。
#
# 展示タイムは締切の約10分前に公開されるため、1日数回では取りこぼす。
# レース開催時間帯だけ10分ごとに動かし、それ以外は止めておく。
# 夜間は実行しないので無駄なアクセスも発生しない。

name: predict-today

on:
  schedule:
    # JST 11:00〜19:50 を10分間隔 (UTC 02:00〜10:50)
    #
    # 展示タイムは締切の約10分前に公開される。
    # 20分間隔では12レース中5レースで展示発表前のデータのままになったため、
    # 10分間隔にして全レースをカバーする。
    # 公開リポジトリなので Actions は無料・無制限。
    - cron: '*/10 2-10 * * *'
  workflow_dispatch:

# 前の実行が終わる前に次が来たら、古い方を打ち切る。
# 15分以内に終わる想定だが、遅延時に重ならないようにする。
concurrency:
  group: predict
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # Workload Identity の認証に必要

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係
        run: pip install requests lhafile lightgbm scikit-learn pandas beautifulsoup4 lxml

      # 前回の出力を引き継ぐ。確定済みの結果を取り直さずに済む。
      - name: 前回の予測を復元
        uses: actions/cache@v4
        with:
          path: firebase/public/data
          key: predict-out-${{ github.run_id }}
          restore-keys: predict-out-

      - name: オッズの蓄積を復元
        uses: actions/cache@v4
        with:
          path: odds.db
          key: odds-db-${{ github.run_id }}
          restore-keys: odds-db-

      - name: オッズを取得
        run: |
          # 締切が近いレースのオッズだけ取る(全件だと10分に収まらない)
          python collect_odds.py --stadiums "${{ vars.STADIUMS || '22' }}" --window 30 || true

      - name: 予測を更新
        run: |
          mkdir -p firebase/public/data
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          python predict_today.py \
            --stadiums "${{ vars.STADIUMS || '22' }}" \
            --window 20 \
            --points 10 \
            --out "firebase/public/data/${TODAY}.json"
          echo "{\"latest\":\"${TODAY}\"}" > firebase/public/data/index.json

      # 組織ポリシーでサービスアカウント鍵の作成が禁止されているため、
      # 鍵を使わない Workload Identity 連携で認証する。
      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: github-deploy@chakuyomi.iam.gserviceaccount.com

      - name: Hosting へ配信
        run: |
          npm install -g firebase-tools
          cd firebase
          firebase deploy --only hosting --project chakuyomi --non-interactive
