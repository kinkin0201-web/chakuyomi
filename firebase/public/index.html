<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チャクヨミ｜着順を、読む。</title>
<meta name="description" content="競艇の1号艇が勝つか崩れるかをAIが判定します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Roboto+Condensed:wght@400;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="hd">
      <div>
        <p class="d" id="dt"></p>
        <h1>チャクヨミ</h1>
      </div>
      <button class="ghost" id="acct" hidden>マイページ</button>
      <button class="ghost" id="signin">ログイン</button>
    </div>
  </header>

  <div id="summary" hidden></div>
  <div id="banner" hidden></div>

  <div class="step"><b>1 — 場所</b><hr></div>
  <div class="chips" id="chips" role="group" aria-label="競艇場"></div>

  <div class="step"><b>2 — レース</b><hr></div>
  <div class="races" id="races" role="group" aria-label="レース"></div>
  <div class="legend" id="legend" hidden></div>

  <div id="verdict"></div>
  <div class="cond" id="cond"></div>

  <div class="step"><b>3 — 出走表</b><hr></div>
  <div class="list" id="list"></div>

  <p class="note" id="note"></p>
</div>

<dialog id="mypage">
  <form method="dialog" class="sheet">
    <h2>マイページ</h2>
    <div id="mp"></div>
    <div class="acts">
      <button class="ghost" value="close">閉じる</button>
    </div>
  </form>
</dialog>

<script type="module" src="/main.js"></script>
</body>
</html>
